spring.application.name=flightmore

# debug mode
logging.level.org.springframework=DEBUG
#logging.level.org.hibernate=DEBUG


# Hibernate JDBC Bind Logging Level
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.highlight_sql=true

# Naver Login API Configuration
naver.client_id=7fbU_K6Ns9BdskY1UZwP
naver.redirect_uri=http://localhost:3000/login/redirected/naver
naver.client_secret=${NAVER_CLIENT_SECRET}
naver.state=FlightMore_Naver_Login

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/flight_more
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

telegram.bot.token = ${TELEGRAM_BOT_TOKEN}